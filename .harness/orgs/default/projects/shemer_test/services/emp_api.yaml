service:
  name: emp api
  identifier: emp_api
  orgIdentifier: default
  projectIdentifier: shemer_test
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: k8s_manifest
            type: HelmChart
            spec:
              store:
                type: Github
                spec:
                  connectorRef: shemer_github
                  gitFetchType: Branch
                  paths:
                    - k8s
                  branch: main
              skipResourceVersioning: false
              enableDeclarativeRollback: false
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - spec:
                connectorRef: ahemer_ghcr
                imagePath: ghcr.io/shemreader/coderabbit-test
                tag: <+pipeline.sequenceId>
                digest: ""
              identifier: coderabbittest
              type: DockerRegistry
    type: Kubernetes
