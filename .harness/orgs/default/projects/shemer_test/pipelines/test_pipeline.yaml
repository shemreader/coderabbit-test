pipeline:
  name: test pipeline
  identifier: test_pipeline
  projectIdentifier: shemer_test
  orgIdentifier: default
  tags:
    ai_generated: ""
  properties:
    ci:
      codebase:
        connectorRef: shemer_github
        repoName: coderabbit-test
        build: <+input>
  stages:
    - stage:
        name: build
        identifier: build
        description: CI build stage using Golden CI Build Template
        template:
          templateRef: Golden_CI_Build_Template
          versionLabel: v1
          templateInputs:
            type: CI
            spec:
              execution:
                steps:
                  - step:
                      identifier: buildAndPushImage
                      type: BuildAndPushDockerRegistry
                      spec:
                        connectorRef: ahemer_ghcr
                        repo: ghcr.io/shemreader/coderabbit-test
    - stage:
        name: security scan
        identifier: security_scan
        description: Security scan stage using Golden Security Scan Template
        template:
          templateRef: Golden_Security_Scan_Template
          versionLabel: v1
          templateInputs:
            type: SecurityTests
            spec:
              execution:
                steps:
                  - step:
                      identifier: container_scan
                      type: AquaTrivy
                      spec:
                        image:
                          type: docker_v2
                          name: ghcr.io/shemreader/coderabbit-test
                          tag: <+pipeline.sequenceId>
                          domain: ghcr.io
    - stage:
        name: deploy to dev
        identifier: deploy_to_dev
        description: Deploy to dev environment
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        template:
          templateRef: Golden_K8s_Deploy_Template
          versionLabel: v1
          templateInputs:
            type: Deployment
            spec:
              service:
                serviceRef: emp_api
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: coderabbittest
                          sources: ""
              environment:
                environmentRef: dev
                infrastructureDefinitions:
                  - identifier: k8s_dev
              execution:
                steps:
                  - step:
                      identifier: health_check
                      type: Http
                      spec:
                        url: http://emp-api.dev.svc.cluster.local/health
    - stage:
        name: deploy to pre-prod
        identifier: deploy_to_pre_prod
        description: Deploy to pre-prod environment
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        template:
          templateRef: Golden_K8s_Deploy_Template
          versionLabel: v1
          templateInputs:
            type: Deployment
            spec:
              service:
                serviceRef: emp_api
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: coderabbittest
              environment:
                environmentRef: pre_prod
                infrastructureDefinitions:
                  - identifier: k8s_pre_prod
              execution:
                steps:
                  - step:
                      identifier: health_check
                      type: Http
                      spec:
                        url: http://emp-api.pre-prod.svc.cluster.local/health
    - stage:
        name: production approval
        identifier: production_approval
        description: Manual approval before production deployment
        type: Approval
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        spec:
          execution:
            steps:
              - step:
                  name: Approve Deployment
                  identifier: approve_deployment
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: Please review and approve deployment to Production
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: true
                      userGroups:
                        - _project_all_users
                    approverInputs: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - stage:
        name: deploy to production
        identifier: deploy_to_production
        description: Deploy to production environment
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        template:
          templateRef: Golden_K8s_Deploy_Template
          versionLabel: v1
          templateInputs:
            type: Deployment
            spec:
              service:
                serviceRef: emp_api
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: coderabbittest
              environment:
                environmentRef: prod
                infrastructureDefinitions:
                  - identifier: k8s_prod
              execution:
                steps:
                  - step:
                      identifier: health_check
                      type: Http
                      spec:
                        url: http://emp-api.prod.svc.cluster.local/health