pipeline:
  name: test pipeline
  identifier: test_pipeline
  description: Builds an image, scans it, and deploys to Kubernetes, with an added Prisma Cloud scan stage.
  projectIdentifier: shemer_test
  orgIdentifier: default
  tags:
    ai_generated: ""
  properties:
    ci:
      codebase:
        connectorRef: shemer_github
        build: <+input>
  stages:
    - stage:
        name: build
        identifier: build
        template:
          templateRef: Golden_CI_Build_Template
          versionLabel: v1
          templateInputs:
            type: CI
            spec:
              execution:
                steps:
                  - step:
                      identifier: buildAndPushImage
                      type: BuildAndPushDockerRegistry
                      spec:
                        connectorRef: <+input>
                        repo: <+input>
    - stage:
        name: security
        identifier: security
        template:
          templateRef: Golden_Security_Scan_Template
          versionLabel: v1
          templateInputs:
            type: SecurityTests
            spec:
              execution:
                steps:
                  - step:
                      identifier: container_scan
                      type: AquaTrivy
                      spec:
                        image:
                          type: docker_v2
                          name: <+input>
                          tag: <+input>
                          domain: <+input>
    - stage:
        name: deploy
        identifier: deploy
        tags: {}
        template:
          templateRef: Golden_K8s_Deploy_Template
          versionLabel: v1
          templateInputs:
            type: Deployment
            spec:
              service:
                serviceRef: <+input>
                serviceInputs: <+input>
              environment:
                environmentRef: <+input>
                infrastructureDefinitions: <+input>
              execution:
                steps:
                  - step:
                      identifier: health_check
                      type: Http
                      spec:
                        url: <+input>
    - stage:
        name: gggg
        identifier: gggg
        description: Prisma Cloud container image scan
        type: SecurityTests
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: PrismaCloud
                  name: Prisma Cloud Scan
                  identifier: prisma_cloud_scan
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: container
                      name: vbvbv
                      variant: vb
                    advanced:
                      log:
                        level: info
                    privileged: true
                    image:
                      type: docker_v2
                      name: vbvbv
                      tag: vb
                      domain: vv
                    auth:
                      access_id: <+secrets.getValue("account.slack_webhook")>
                      access_token: <+secrets.getValue("shemer_git_token")>
                      domain: vbvbv
        tags: {}
