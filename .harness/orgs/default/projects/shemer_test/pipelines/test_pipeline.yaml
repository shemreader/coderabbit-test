pipeline:
  name: test pipeline
  identifier: test_pipeline
  projectIdentifier: shemer_test
  orgIdentifier: default
  tags:
    ai_generated: ""
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: <+input>
        build: <+input>
  stages:
    - stage:
        name: build
        identifier: build
        description: "CI build stage using Golden CI Build Template"
        type: CI
        template:
          templateRef: Golden_CI_Build_Template
          versionLabel: v1
          templateInputs:
            type: CI
            spec:
              infrastructure:
                type: KubernetesDirect
                spec:
                  connectorRef: <+input>
                  namespace: <+input>
                  serviceAccountName: <+input>
              execution:
                steps:
                  - step:
                      identifier: buildAndPushImage
                      type: BuildAndPushDockerRegistry
                      spec:
                        connectorRef: <+input>
                        repo: <+input>
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - stage:
        name: security scan
        identifier: security_scan
        description: "Security scan stage using Golden Security Scan Template"
        type: SecurityTests
        template:
          templateRef: Golden_Security_Scan_Template
          versionLabel: v1
          templateInputs:
            type: SecurityTests
            spec:
              infrastructure:
                type: KubernetesDirect
                spec:
                  connectorRef: <+input>
                  namespace: <+input>
                  serviceAccountName: <+input>
              execution:
                steps:
                  - step:
                      identifier: container_scan
                      type: AquaTrivy
                      spec:
                        image:
                          type: docker_v2
                          name: <+input>
                          tag: <+pipeline.sequenceId>
                          domain: <+input>
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - stage:
        name: deploy to dev
        identifier: deploy_to_dev
        description: "Deploy to dev environment"
        type: Deployment
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        template:
          templateRef: Golden_K8s_Deploy_Template
          versionLabel: v1
          templateInputs:
            type: Deployment
            spec:
              service:
                serviceRef: <+input>
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
                          sources: ""
              environment:
                environmentRef: <+input>
                infrastructureDefinitions:
                  - identifier: <+input>
              execution:
                steps:
                  - step:
                      identifier: health_check
                      type: Http
                      spec:
                        url: <+input>
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: deploy to pre-prod
        identifier: deploy_to_pre_prod
        description: "Deploy to pre-prod environment"
        type: Deployment
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        template:
          templateRef: Golden_K8s_Deploy_Template
          versionLabel: v1
          templateInputs:
            type: Deployment
            spec:
              service:
                serviceRef: <+input>
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
              environment:
                environmentRef: <+input>
                infrastructureDefinitions:
                  - identifier: <+input>
              execution:
                steps:
                  - step:
                      identifier: health_check
                      type: Http
                      spec:
                        url: <+input>
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
    - stage:
        name: production approval
        identifier: production_approval
        description: "Manual approval before production deployment"
        type: Approval
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        spec:
          execution:
            steps:
              - step:
                  name: Approve Deployment
                  identifier: approve_deployment
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: <+input>
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: true
                      userGroups:
                        - <+input>
                    approverInputs: []
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - stage:
        name: deploy to production
        identifier: deploy_to_production
        description: "Deploy to production environment"
        type: Deployment
        when:
          pipelineStatus: Success
          condition: <+trigger.event> != "PR"
        template:
          templateRef: Golden_K8s_Deploy_Template
          versionLabel: v1
          templateInputs:
            type: Deployment
            spec:
              service:
                serviceRef: <+input>
                serviceInputs:
                  serviceDefinition:
                    type: Kubernetes
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: <+input>
              environment:
                environmentRef: <+input>
                infrastructureDefinitions:
                  - identifier: <+input>
              execution:
                steps:
                  - step:
                      identifier: health_check
                      type: Http
                      spec:
                        url: <+input>
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback