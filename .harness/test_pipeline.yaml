pipeline:
  projectIdentifier: shemer_test
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: shemer_github
        build: <+input>
  stages:
    - stage:
        name: build
        identifier: build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8s_cluster
              namespace: harness-delegate-ng
              serviceAccountName: shemer-delegate
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build And Push GHCR
                  identifier: BuildAndPushDockerRegistry_1
                  spec:
                    connectorRef: ahemer_ghcr
                    repo: ghcr.io/shemreader/coderabbit-test
                    tags:
                      - <+pipeline.sequenceId>
                      - latest
              - step:
                  type: Run
                  name: Security Scan
                  identifier: securityScan
                  spec:
                    shell: Sh
                    image: aquasec/trivy:latest
                    command: |-
                      trivy image --exit-code 0 --severity HIGH,CRITICAL \
                        ghcr.io/shemreader/coderabbit-test:<+pipeline.sequenceId>
              - step:
                  type: Run
                  name: Update GitOps Manifest
                  identifier: updateGitOpsManifest
                  spec:
                    shell: Sh
                    image: alpine/git
                    envVariables:
                      GITHUB_TOKEN: <+secrets.getValue("github_pat")>
                    command: |-
                      set -e
                      sed -i "s#^\(\s*tag:\s*\).*#\1\"<+pipeline.sequenceId>\"#" k8s/values.yaml
                      git config user.email "ci@harness.io"
                      git config user.name "Harness CI"
                      git add k8s/values.yaml
                      git commit -m "ci: bump emp-api image to <+pipeline.sequenceId> [skip ci]" || echo "no changes to commit"
                      git push "https://x-access-token:${GITHUB_TOKEN}@github.com/shemreader/coderabbit-test.git" HEAD:main
  identifier: test_pipeline
  name: test pipeline
